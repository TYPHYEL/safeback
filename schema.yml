    get:
      operationId: admin_drivers_pending_retrieve
      description: Get pending drivers for admin approval
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
          description: ''
  /api/ai/analyze_risk/:
    post:
      operationId: ai_analyze_risk_create
      description: Analyze risk based on location, time, and context using Qwen AI
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/chat/:
