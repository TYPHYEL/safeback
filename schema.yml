components:
  schemas:
    AlertTypeEnum:
      enum:
      - aggression
      - accident
      - medical
      - kidnapping
      - robbery
      - harassment
      - other
      type: string
      description: |-
        * `aggression` - Aggression
        * `accident` - Accident
        * `medical` - Medical
        * `kidnapping` - Kidnapping
        * `robbery` - Robbery
        * `harassment` - Harassment
        * `other` - Other
    BiometricRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        driver:
          type: integer
          readOnly: true
        selfie:
          type: string
          format: uri
        reference:
          type: string
          format: uri
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BiometricRequestStatusEnum'
          readOnly: true
        result:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - driver
      - id
      - result
      - selfie
      - status
    BiometricRequestStatusEnum:
      enum:
      - pending
      - processing
      - verified
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `processing` - Processing
        * `verified` - Verified
        * `failed` - Failed
    BlankEnum:
      enum:
      - ''
    Deposit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        passenger:
          type: integer
        passenger_name:
          type: string
          readOnly: true
        driver:
          type: integer
          readOnly: true
          nullable: true
        driver_name:
          type: string
          readOnly: true
        taxi:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/DepositStatusEnum'
          readOnly: true
        pickup_location:
          type: string
          maxLength: 255
        pickup_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        pickup_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        dropoff_location:
          type: string
          maxLength: 255
        dropoff_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        dropoff_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Distance en km
        fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Prix proposé en FCFA
        is_night:
          type: boolean
          description: Tarif de nuit appliqué
        pickup_time:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Expiration de la demande
        driver_trust_score:
          type: string
          readOnly: true
      required:
      - completed_at
      - created_at
      - distance_km
      - driver
      - driver_name
      - driver_trust_score
      - dropoff_lat
      - dropoff_lng
      - dropoff_location
      - expires_at
      - fare
      - id
      - passenger
      - passenger_name
      - pickup_lat
      - pickup_lng
      - pickup_location
      - started_at
      - status
      - taxi
    DepositStatusEnum:
      enum:
      - pending
      - offered
      - validated
      - active
      - completed
      - cancelled
      - expired
      type: string
      description: |-
        * `pending` - Pending
        * `offered` - Offered
        * `validated` - Validated
        * `active` - Active
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `expired` - Expired
    Device:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        token:
          type: string
          maxLength: 512
        platform:
          type: string
          maxLength: 32
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - token
      - user
    DriverDocument:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        driver:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
        doc_type:
          type: string
          maxLength: 64
        status:
          allOf:
          - $ref: '#/components/schemas/DriverDocumentStatusEnum'
          readOnly: true
        notes:
          type: string
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - driver
      - file
      - id
      - status
      - uploaded_at
    DriverDocumentStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    DriverProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone_number:
          type: string
          nullable: true
          maxLength: 32
        license_number:
          type: string
          nullable: true
          maxLength: 64
        vehicle_type:
          type: string
          nullable: true
          maxLength: 100
        plate_number:
          type: string
          nullable: true
          maxLength: 20
        license_photo:
          type: string
          format: uri
          nullable: true
        vehicle_photo:
          type: string
          format: uri
          nullable: true
        cni_photo:
          type: string
          format: uri
          nullable: true
        profile_photo:
          type: string
          format: uri
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        verified:
          type: boolean
          readOnly: true
        is_active:
          type: boolean
        documents: {}
        qr_code:
          type: string
          readOnly: true
          nullable: true
        face_embedding:
          readOnly: true
      required:
      - face_embedding
      - id
      - qr_code
      - verified
    DriverRotation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        shift_type:
          allOf:
          - $ref: '#/components/schemas/ShiftTypeEnum'
          default: full
        days_of_week:
          description: List of days (1-7 for Monday-Sunday)
        start_time:
          type: string
          format: time
          description: Shift start time
        end_time:
          type: string
          format: time
          description: Shift end time
        start_date:
          type: string
          format: date
          nullable: true
          description: Optional start date
        end_date:
          type: string
          format: date
          nullable: true
          description: Optional end date
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        taxi:
          type: integer
        driver:
          type: integer
      required:
      - created_at
      - driver
      - end_time
      - id
      - start_time
      - taxi
      - updated_at
    EmergencyContact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 32
        relation:
